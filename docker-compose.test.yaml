services:
  server_test:
    build:
      context: ./server
      dockerfile: Dockerfile.test
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWD}", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
