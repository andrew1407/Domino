name: GitHub Pages showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: static export
        run: npm run export && touch out/.nojekyll
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # the showcase talks to a local server API by default (changeable in the UI)
          NEXT_PUBLIC_SERVER_ADDR: localhost:8080
          NEXT_PUBLIC_WS_ADDR: localhost:8081
          NEXT_PUBLIC_DEFAULT_MODE: online
      - uses: actions/upload-pages-artifact@v4
        with:
          path: client/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
