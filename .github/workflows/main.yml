name: Domino CI tests

on: [push, pull_request]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: containers test
        run: docker compose -f docker-compose.test.yaml --env-file ./.env.example up --build --exit-code-from server_test
      - name: containers cleanup
        if: always()
        run: docker compose -f docker-compose.test.yaml --env-file ./.env.example down --volumes

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
